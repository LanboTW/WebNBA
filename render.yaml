# Render Blueprint: the game server (free plan).
# New -> Blueprint in the Render dashboard, pick this repo.
# Roster updates are done by hand (npm run roster:update, then push); every
# push to main redeploys this service and GitHub Pages.
services:
  # Game server + the full game page (online play works on this URL too).
  - type: web
    name: webnba
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm run start -w server
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
