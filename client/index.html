<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>WebNBA</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="app"></div>

    <div id="hud" class="hidden">
      <div id="scoreboard">
        <div class="team" id="t0"><span class="abbr"></span><span class="pts">0</span></div>
        <div class="center">
          <div class="period">Q1</div>
          <div class="clock">3:00</div>
        </div>
        <div class="team right" id="t1"><span class="pts">0</span><span class="abbr"></span></div>
        <div class="shotclock">24</div>
      </div>
      <div id="statline"></div>
      <div id="meter"><div class="zone good"></div><div class="zone perfect"></div><div class="fill"></div></div>
      <div id="passIcons"></div>
      <div id="toasts"></div>
      <div id="help">
        <b>進攻</b>　WASD 移動　Shift 加速<br />
        J 投籃（按住，綠區放開）　1–4 傳給頭上號碼的隊友<br />
        K 傳球（按方向鍵傳那一側，否則傳最近的；標亮者接球）<br />
        空白鍵 起跳（持球起跳＝收球，落地後不能再運）<br />
        <b>防守</b>　按住 U 加強防守　K 抄截　空白鍵 蓋火鍋／搶籃板　L 切換球員<br />
        Esc 暫停／數據　H 隱藏說明
      </div>
    </div>

    <div id="menu" class="overlay">
      <div class="panel">
        <h1>WebNBA</h1>
        <p class="sub">3D 籃球 · <span id="season"></span> 名單</p>
        <div class="row">
          <label>你的隊伍<select id="homeSel"></select></label>
          <label>對手<select id="awaySel"></select></label>
        </div>
        <div class="matchup"><div id="homeCard" class="card"></div><div class="vs">VS</div><div id="awayCard" class="card"></div></div>
        <div class="row">
          <label>模式
            <select id="modeSel">
              <option value="game">對戰電腦</option>
              <option value="watch">電腦對戰（觀戰）</option>
              <option value="practice">投籃練習</option>
            </select>
          </label>
          <label>難度
            <select id="diffSel">
              <option value="easy">簡單</option>
              <option value="normal" selected>普通</option>
              <option value="hard">困難</option>
            </select>
          </label>
          <label>每節長度
            <select id="quarterSel">
              <option value="60">1 分鐘</option>
              <option value="120">2 分鐘</option>
              <option value="180" selected>3 分鐘</option>
              <option value="300">5 分鐘</option>
              <option value="720">12 分鐘</option>
            </select>
          </label>
        </div>
        <button id="startBtn" class="primary">開始比賽</button>
        <p class="fine">非官方粉絲作品，與 NBA 及其球隊無關。</p>
      </div>
    </div>

    <div id="boxscore" class="overlay hidden">
      <div class="panel wide">
        <h2 id="boxTitle">暫停</h2>
        <div id="boxTables"></div>
        <div class="buttons">
          <button id="resumeBtn" class="primary">繼續</button>
          <button id="quitBtn">回主選單</button>
        </div>
      </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
